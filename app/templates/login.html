{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <h2>Login</h2>
        <p class="subtitle">Manage your bookings efficiently</p>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-full shadow-hover">Login</button>
        </form>
        <p class="auth-redirect">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
    </div>
</div>
{% endblock %}
