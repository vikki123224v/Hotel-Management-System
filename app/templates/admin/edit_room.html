{% extends 'base.html' %}

{% block content %}
<div class="admin-wrapper fade-in">
    <div class="header-split mb-4">
        <h2>Edit Room #{{ room.room_number }}</h2>
        <a href="{{ url_for('admin.rooms') }}" class="btn btn-outline">Back to Rooms</a>
    </div>

    <div class="card glass-card slide-up" style="max-width: 600px;">
        <form method="POST" action="{{ url_for('admin.edit_room', room_id=room.id) }}">
            <div class="form-group">
                <label>Room Number</label>
                <input type="text" name="room_number" value="{{ room.room_number }}" required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select name="type" required>
                    <option value="Single" {% if room.type=='Single' %}selected{% endif %}>Single</option>
                    <option value="Double" {% if room.type=='Double' %}selected{% endif %}>Double</option>
                    <option value="Standard" {% if room.type=='Standard' %}selected{% endif %}>Standard</option>
                    <option value="Deluxe" {% if room.type=='Deluxe' %}selected{% endif %}>Deluxe</option>
                    <option value="Suite" {% if room.type=='Suite' %}selected{% endif %}>Suite</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price per Night ($)</label>
                <input type="number" step="0.01" name="price" value="{{ room.price }}" required>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary shadow-hover">Save Changes</button>
                <a href="{{ url_for('admin.rooms') }}" class="btn btn-outline ml-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
